name: Temporary Hermes PM mirror (Node + npm)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Download official pinned Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          curl --fail --location --retry 3 --retry-all-errors \
            "https://nodejs.org/dist/v26.12.1/node-v26.12.1-win-x64.zip" \
            --output "dist/node-v26.12.1-win-x64.zip"

          curl --fail --location --retry 3 --retry-all-errors \
            "https://registry.npmjs.org/npm/-/npm-12.0.2.tgz" \
            --output "dist/npm-12.0.2.tgz"

          echo "b3efd5c70cba3308ed46e7e699a9b8aac075bbc6b027fcb39c84c31acc25e2b4  dist/node-v26.12.1-win-x64.zip" | sha256sum --check
          echo "5dbb86c71d07a1957f2e90734092dd6a58bdcd9ebc2d8d41ca1c6e6a21d364e1  dist/npm-12.0.2.tgz" | sha256sum --check

      - name: Publish verified files as a temporary GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "hermes-pm-cache-v0.22.5-20261101" \
            "dist/node-v26.12.1-win-x64.zip" \
            "dist/npm-12.0.2.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Temporary Hermes PM cache — Node 26.12.1 + npm 12.0.2" \
            --notes "Temporary transfer of official upstream artifacts. Both files were SHA-256 verified in GitHub Actions against the pins in Hermes Agent v0.22.5 pm/lock.json. Safe to delete after local installation."
