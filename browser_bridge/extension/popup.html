<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agent ChatAI Bridge</title>
    <style>
        body {
            min-width: 320px;
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 10px;
        }

        .bridge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .bridge-header h1 {
            margin: 0;
        }

        .bridge-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .bridge-toggle {
            position: relative;
            width: 38px;
            height: 22px;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 999px;
            background: #d1d5db;
            cursor: pointer;
            transition: background .15s ease;
        }

        .bridge-toggle-knob {
            position: absolute;
            left: 3px;
            top: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
            transition: transform .15s ease;
        }

        .bridge-toggle[aria-checked="true"] {
            background: #16a34a;
        }

        .bridge-toggle[aria-checked="true"] .bridge-toggle-knob {
            transform: translateX(16px);
        }

        .bridge-shortcut {
            font-size: 9px;
            color: #6b7280;
            white-space: nowrap;
        }

        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 12px;
        }
    </style>
</head>
<body>
        <div class="bridge-header">
        <h1>Agent ChatAI Bridge</h1>

        <div class="bridge-controls">
            <button
                id="bridgeToggle"
                type="button"
                role="switch"
                aria-checked="false"
                aria-label="Включить Agent ChatAI Bridge"
                class="bridge-toggle"
                title="Alt+Shift+A — включить или выключить Bridge"
            >
                <span class="bridge-toggle-knob"></span>
            </button>

            
        </div>
    </div>

    <label for="code">
        Gateway pairing code
    </label>

    <input
        id="code"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="pair">
        Pair with Gateway
    </button>

    <div id="status">
        Checking browser key...
    </div>

    <script src="browser_keys.js"></script>
    <script src="popup.js"></script>
</body>
</html>
