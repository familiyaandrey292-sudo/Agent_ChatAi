<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agent ChatAI Bridge</title>
    <style>
        body {
            min-width: 320px;
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>Agent ChatAI Bridge</h1>

    <label for="code">
        Gateway pairing code
    </label>

    <input
        id="code"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="pair">
        Pair with Gateway
    </button>

    <div id="status">
        Checking browser key...
    </div>

    <script src="browser_keys.js"></script>
    <script src="popup.js"></script>
</body>
</html>
