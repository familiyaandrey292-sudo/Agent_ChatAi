<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agent ChatAI Bridge</title>
    <style>
        body {
            min-width: 320px;
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 10px;
        }

        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 12px;
        }

        #bridge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            font-size: 13px;
        }

        #bridge-toggle {
            display: none;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
            margin: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #bbb;
            border-radius: 22px;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 2px;
            top: 2px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.15s ease;
        }

        #bridge-toggle:checked + .slider {
            background: #2b7de9;
        }

        #bridge-toggle:checked + .slider::before {
            transform: translateX(18px);
        }

        #bridge-toggle:disabled + .slider {
            opacity: 0.45;
            cursor: default;
        }
    </style>
</head>
<body>
    <h1>Agent ChatAI Bridge</h1>

    <div id="bridge-row">
        <span id="bridge-label">Bridge enabled on this tab</span>
        <input id="bridge-toggle" type="checkbox">
        <label class="switch" for="bridge-toggle">
            <span class="slider"></span>
        </label>
    </div>

    <label for="code">
        Gateway pairing code
    </label>

    <input
        id="code"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="pair">
        Pair with Gateway
    </button>

    <div id="status">
        Checking browser key...
    </div>

    <script src="browser_keys.js"></script>
    <script src="popup.js"></script>
</body>
</html>
