<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Agent ChatAI Bridge</title>
    <style>
        body {
            min-width: 320px;
            margin: 0;
            padding: 16px;
            font-family: system-ui, sans-serif;
        }

        h1 {
            font-size: 16px;
            margin: 0 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-bottom: 10px;
        }

        .bridge-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .bridge-header h1 {
            margin: 0;
        }

        .bridge-controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
        }

        .bridge-toggle {
            position: relative;
            width: 38px;
            height: 22px;
            padding: 0;
            margin: 0;
            border: 0;
            border-radius: 999px;
            background: #d1d5db;
            cursor: pointer;
            transition: background .15s ease;
        }

        .bridge-toggle-knob {
            position: absolute;
            left: 3px;
            top: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(0,0,0,.25);
            transition: transform .15s ease;
        }

        .bridge-toggle[aria-checked="true"] {
            background: #16a34a;
        }

        .bridge-toggle[aria-checked="true"] .bridge-toggle-knob {
            transform: translateX(16px);
        }

        .bridge-shortcut {
            font-size: 9px;
            color: #6b7280;
            white-space: nowrap;
        }

        button {
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        #status {
            margin-top: 12px;
            white-space: pre-wrap;
            font-size: 12px;
        }

        .session {
            margin: 0 0 16px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }

        .session-title {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .session-row {
            display: flex;
            gap: 6px;
        }

        #sessionId {
            flex: 1 1 auto;
            min-width: 0;
            margin: 0;
            font-family: ui-monospace, monospace;
            font-size: 11px;
        }

        #copySessionId {
            width: auto;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        .discovery {
            margin: 0 0 16px;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
        }

        .discovery-title {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .discovery-instruction {
            margin: 0 0 10px;
            font-size: 12px;
            line-height: 1.45;
        }

        .discovery-copy-row {
            display: flex;
            gap: 6px;
            align-items: stretch;
        }

        #discoveryPhrase {
            flex: 1 1 auto;
            box-sizing: border-box;
            padding: 8px;
            margin: 0;
            font-size: 12px;
        }

        #copyDiscovery {
            width: auto;
            flex: 0 0 auto;
            padding: 8px 10px;
            white-space: nowrap;
        }

        .discovery-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        #discoveryToggle {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: #d1d5db;
            display: grid;
            place-items: center;
        }

        #discoveryToggle:hover:not(:disabled) {
            filter: brightness(.96);
        }

        .discovery-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6b7280;
            box-shadow: 0 0 0 0 rgba(107,114,128,.25);
        }

        #discoveryToggle[data-listening="true"] {
            background: #dcfce7;
        }

        #discoveryToggle[data-listening="true"] .discovery-dot {
            background: #16a34a;
            animation: discovery-pulse 1.4s ease-out infinite;
        }

        @keyframes discovery-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(22,163,74,.35);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(22,163,74,0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(22,163,74,0);
            }
        }

        .discovery-state {
            font-size: 12px;
            font-weight: 600;
        }

        .discovery-help {
            margin-top: 6px;
            font-size: 11px;
            color: #6b7280;
            line-height: 1.35;
        }
    </style>
</head>
<body>
        <div class="bridge-header">
        <h1>Agent ChatAI Bridge</h1>

        <div class="bridge-controls">
            <button
                id="bridgeToggle"
                type="button"
                role="switch"
                aria-checked="false"
                aria-label="Включить Agent ChatAI Bridge"
                class="bridge-toggle"
                title="Alt+Shift+A — включить или выключить Bridge"
            >
                <span class="bridge-toggle-knob"></span>
            </button>

            
        </div>
    </div>

    <section class="session">
        <h2 class="session-title">Сессия Bridge</h2>
        <div class="session-row">
            <input
                id="sessionId"
                type="text"
                readonly
                spellcheck="false"
                aria-label="session_id"
            >
            <button
                id="copySessionId"
                type="button"
                title="Скопировать session_id"
            >
                Копировать
            </button>
        </div>
    </section>

    <section class="discovery">
        <h2 class="discovery-title">
            Найти поле чата и кнопку отправки
        </h2>

        <p class="discovery-instruction">
            Нажми на кнопку и вставь в поле чата:
        </p>

        <div class="discovery-copy-row">
            <input
                id="discoveryPhrase"
                type="text"
                readonly
                spellcheck="false"
            >

            <button
                id="copyDiscovery"
                type="button"
                title="Скопировать фразу"
            >
                Копировать
            </button>
        </div>

        <div class="discovery-control">
            <button
                id="discoveryToggle"
                type="button"
                aria-pressed="false"
                data-listening="false"
                title="Начать или остановить поиск элементов чата"
            >
                <span
                    class="discovery-dot"
                    aria-hidden="true"
                ></span>
            </button>

            <span
                id="discoveryState"
                class="discovery-state"
            >
                Покой
            </span>
        </div>

        <div
            id="discoveryHelp"
            class="discovery-help"
        >
            После нажатия кнопки Bridge сам определит поле, кнопку отправки и появившееся сообщение.
        </div>

        <button
            id="copyDiscoveryDiagnostics"
            type="button"
            title="Скопировать журнал discovery"
        >
            Скопировать диагностику
        </button>
    </section>

    <label for="code">
        Gateway pairing code
    </label>

    <input
        id="code"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <button id="pair">
        Pair with Gateway
    </button>

    <div id="status">
        Checking browser key...
    </div>

    <script src="browser_keys.js"></script>
    <script src="popup.js"></script>
</body>
</html>
